<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Track Order</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
        }

        header {
            background: white;
            padding: 18px 6%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        header a {
            text-decoration: none;
            color: #222;
            font-weight: bold;
        }

        .container {
            max-width: 500px;
            margin: 70px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 14px;
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

    </style>

</head>

<body>

<header>

    <a href="/">
        🍎 Mahalakshmi Pazhamuthirsolai
    </a>

</header>


<div class="container">

    <div class="box">

        <h1>
            Track Your Order
        </h1>

        <p>
            Enter your order number to check the order status.
        </p>

        <form
            method="GET"
            onsubmit="goToOrder(event)"
        >

            <label>
                Order Number
            </label>

            <input
                type="number"
                id="order_id"
                placeholder="Example: 1"
                required
            >

            <button type="submit">
                Track Order
            </button>

        </form>

    </div>

</div>


<script>

function goToOrder(event) {

    event.preventDefault();

    const orderId =
        document.getElementById("order_id").value;

    window.location.href =
        "/track-order/" + orderId + "/";

}

</script>

</body>

</html>
